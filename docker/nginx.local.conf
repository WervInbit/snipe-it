server {
    listen 80;
    server_name 127.0.0.1 localhost;

    root /var/www/html/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Legacy workflow evidence is read server-side and served only by the
    # authenticated controller route.
    location ^~ /uploads/test_images/ {
        return 404;
    }

    # Uploaded content must never reach a PHP/script handler, even if a future
    # feature accidentally stores a file with an executable extension.
    location ~* ^/uploads/.*\.(?:php[0-9]?|phtml|phar|cgi|pl|py|sh)(?:/|$) {
        deny all;
        return 404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO http;
        fastcgi_read_timeout 120s;
    }

    client_max_body_size 32m;
}
