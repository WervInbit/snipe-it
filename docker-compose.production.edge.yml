services:
  edge_tls_init:
    image: ${SNIPEIT_WEB_IMAGE:?Set the web image repository}@${SNIPEIT_WEB_IMAGE_DIGEST:?Set the immutable web image sha256 digest}
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        cp /input/tls.fullchain.crt /output/tls.fullchain.crt
        cp /input/tls.key /output/tls.key
        chown 101:101 /output/tls.fullchain.crt /output/tls.key
        chmod 0444 /output/tls.fullchain.crt
        chmod 0440 /output/tls.key
    volumes:
      - type: bind
        source: ${TLS_CERTIFICATE_FILE:?Set the TLS full-chain certificate path}
        target: /input/tls.fullchain.crt
        read_only: true
      - type: bind
        source: ${TLS_PRIVATE_KEY_FILE:?Set the TLS private-key path}
        target: /input/tls.key
        read_only: true
      - production_edge_tls:/output
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    restart: "no"
    profiles:
      - production

  edge:
    image: ${SNIPEIT_WEB_IMAGE:?Set the web image repository}@${SNIPEIT_WEB_IMAGE_DIGEST:?Set the immutable web image sha256 digest}
    depends_on:
      web:
        condition: service_healthy
      edge_tls_init:
        condition: service_completed_successfully
    ports:
      - "${EDGE_BIND_ADDRESS:-0.0.0.0}:${EDGE_HTTP_PORT:-80}:8080"
      - "${EDGE_BIND_ADDRESS:-0.0.0.0}:${EDGE_HTTPS_PORT:-443}:8443"
    volumes:
      - type: bind
        source: ${EDGE_NGINX_CONFIG:-./docker/production/edge-nginx.conf}
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: volume
        source: production_edge_tls
        target: /etc/nginx/tls
        read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
      - /var/cache/nginx:uid=101,gid=101,mode=0750
      - /var/run:uid=101,gid=101,mode=0750
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - production
    profiles:
      - production
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "--spider", "https://127.0.0.1:8443/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

networks:
  production:
    ipam:
      config:
        - subnet: ${SNIPEIT_NETWORK_SUBNET:-172.31.208.0/24}

volumes:
  production_edge_tls:
    name: ${SNIPEIT_EDGE_TLS_VOLUME:-snipeit-production-edge-tls}
