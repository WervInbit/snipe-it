services:
  db:
    image: mariadb:11.4.7@sha256:39596f079862334be04f4231664862e55d4febe54309cc62f750f2297de85b06
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?Set the isolated rehearsal database}
      MARIADB_USER: ${DB_USERNAME:?Set the isolated rehearsal database user}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    command:
      - --event-scheduler=OFF
    secrets:
      - db_password
      - db_root_password
    volumes:
      - rehearsal_db_data:/var/lib/mysql
    networks:
      - production
    profiles:
      - production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - rehearsal_redis_data:/data
    networks:
      - production
    profiles:
      - production
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      DB_DUMP_SKIP_SSL: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    depends_on:
      app:
        condition: service_healthy

  queue:
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      DB_DUMP_SKIP_SSL: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      DB_DUMP_SKIP_SSL: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  edge_tls_init:
    image: ${SNIPEIT_WEB_IMAGE:?Set the web image repository}@${SNIPEIT_WEB_IMAGE_DIGEST:?Set the immutable web image sha256 digest}
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        cp /input/rehearsal.crt /output/rehearsal.crt
        cp /input/rehearsal.key /output/rehearsal.key
        chown 101:101 /output/rehearsal.crt /output/rehearsal.key
        chmod 0440 /output/rehearsal.crt /output/rehearsal.key
    volumes:
      - type: bind
        source: ${REHEARSAL_TLS_CERT_FILE:?Set the rehearsal TLS certificate path}
        target: /input/rehearsal.crt
        read_only: true
      - type: bind
        source: ${REHEARSAL_TLS_KEY_FILE:?Set the rehearsal TLS private-key path}
        target: /input/rehearsal.key
        read_only: true
      - rehearsal_tls_data:/output
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    restart: "no"
    profiles:
      - production

  edge:
    image: ${SNIPEIT_WEB_IMAGE:?Set the web image repository}@${SNIPEIT_WEB_IMAGE_DIGEST:?Set the immutable web image sha256 digest}
    depends_on:
      web:
        condition: service_healthy
      edge_tls_init:
        condition: service_completed_successfully
    ports:
      - "${REHEARSAL_BIND_ADDRESS:-127.0.0.1}:${SNIPEIT_HTTPS_PORT:-18443}:8443"
    volumes:
      - type: bind
        source: ./docker/rehearsal/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: volume
        source: rehearsal_tls_data
        target: /etc/nginx/tls
        read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
      - /var/cache/nginx:uid=101,gid=101,mode=0750
      - /var/run:uid=101,gid=101,mode=0750
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    restart: unless-stopped
    networks:
      - production
    profiles:
      - production
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "--spider", "https://127.0.0.1:8443/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

networks:
  production:
    ipam:
      config:
        - subnet: ${REHEARSAL_NETWORK_SUBNET:-172.31.208.0/24}

volumes:
  rehearsal_db_data:
    name: ${SNIPEIT_DB_VOLUME:?Set a unique rehearsal database volume}
  rehearsal_redis_data:
    name: ${SNIPEIT_REDIS_VOLUME:?Set a unique rehearsal Redis volume}
  rehearsal_tls_data:
    name: ${SNIPEIT_TLS_VOLUME:?Set a unique rehearsal TLS volume}

secrets:
  db_root_password:
    file: ${DB_ROOT_PASSWORD_FILE:?Set the rehearsal root-password file}
