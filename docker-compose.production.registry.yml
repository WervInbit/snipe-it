services:
  registry:
    image: registry@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
    ports:
      - "127.0.0.1:${SNIPEIT_REGISTRY_PORT:-5000}:5000"
    volumes:
      - production_registry_data:/var/lib/registry
    tmpfs:
      - /tmp:mode=1777
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 30s
    profiles:
      - registry

volumes:
  production_registry_data:
    name: ${SNIPEIT_REGISTRY_VOLUME:-snipeit-production-registry-data}
