        </g><text x="22" y="71.2" font-family="Arial, Helvetica, sans-serif" font-size="5.1" font-weight="900" fill="#102033" text-anchor="start"><tspan x="22" dy="0">Deel 5: Hoe een modelspecificatie ontstaat</tspan></text><text x="22" y="77" font-family="Arial, Helvetica, sans-serif" font-size="2.35" font-weight="400" fill="#53657A" text-anchor="start"><tspan x="22" dy="0">Eén exact modelnummer combineert stabiele productfeiten met een verwachte fysieke opbouw.</tspan></text><rect x="12" y="82" width="90" height="44" rx="1.8" fill="#F7F1FB" stroke="#7A4E9D" stroke-width="0.45" opacity="1" data-component="direct-value-decision"></rect><text x="17" y="90" font-family="Arial, Helvetica, sans-serif" font-size="2.75" font-weight="900" fill="#7A4E9D" text-anchor="start"><tspan x="17" dy="0">Directe attribuutwaarde</tspan></text><text x="17" y="97" font-family="Arial, Helvetica, sans-serif" font-size="1.85" font-weight="400" fill="#102033" text-anchor="start"><tspan x="17" dy="0">Gebruik voor een stabiel feit van deze fabrikantvariant.</tspan><tspan x="17" dy="2.7">Voorbeelden: introductiejaar, gewicht, kleur en schermdiagonaal.</tspan></text><text x="17" y="117" font-family="Arial, Helvetica, sans-serif" font-size="1.7" font-weight="800" fill="#7A4E9D" text-anchor="start"><tspan x="17" dy="0">De waarde hoort rechtstreeks bij het modelnummer.</tspan></text><rect x="108" y="82" width="90" height="44" rx="1.8" fill="#FFF8E6" stroke="#B66A00" stroke-width="0.45" opacity="1" data-component="expected-component-decision"></rect><text x="113" y="90" font-family="Arial, Helvetica, sans-serif" font-size="2.75" font-weight="900" fill="#B66A00" text-anchor="start"><tspan x="113" dy="0">Verwachte component</tspan></text><text x="113" y="97" font-family="Arial, Helvetica, sans-serif" font-size="1.85" font-weight="400" fill="#102033" text-anchor="start"><tspan x="113" dy="0">Gebruik voor hardware die vervangbaar, telbaar of apart te controleren is.</tspan><tspan x="113" dy="2.7">Voorbeelden: RAM, opslag, batterij en moederbord.</tspan></text><text x="113" y="117" font-family="Arial, Helvetica, sans-serif" font-size="1.65" font-weight="800" fill="#B66A00" text-anchor="start"><tspan x="113" dy="0">De componentbijdragen kunnen de getoonde specificatie bepalen.</tspan></text><rect x="12" y="132" width="186" height="40" rx="1.8" fill="#FFFFFF" stroke="#C8D5E2" stroke-width="0.45" opacity="1" data-component="model-spec-example"></rect><text x="17" y="139" font-family="Arial, Helvetica, sans-serif" font-size="2.65" font-weight="900" fill="#7A4E9D" text-anchor="start"><tspan x="17" dy="0">Voorbeeld: HP ProBook 450 G8 - 2E9F8EA#ABH</tspan></text><text x="17" y="147" font-family="Arial, Helvetica, sans-serif" font-size="2.05" font-weight="900" fill="#7A4E9D" text-anchor="start"><tspan x="17" dy="0">Direct op modelnummer</tspan></text><text x="17" y="154" font-family="Arial, Helvetica, sans-serif" font-size="1.85" font-weight="400" fill="#53657A" text-anchor="start"><tspan x="17" dy="0">Introductiejaar = 2021</tspan><tspan x="17" dy="3">Schermdiagonaal = 15,6 inch</tspan></text><line x1="94" y1="143" x2="94" y2="166" stroke="#C8D5E2" stroke-width="0.35"></line><text x="101" y="147" font-family="Arial, Helvetica, sans-serif" font-size="2.05" font-weight="900" fill="#B66A00" text-anchor="start"><tspan x="101" dy="0">Via verwachte componenten</tspan></text><text x="101" y="154" font-family="Arial, Helvetica, sans-serif" font-size="1.85" font-weight="400" fill="#53657A" text-anchor="start"><tspan x="101" dy="0">1 x RAM 8 GB DDR4</tspan><tspan x="101" dy="3">1 x Storage 256 GB NVMe</tspan></text><text x="17" y="168" font-family="Arial, Helvetica, sans-serif" font-size="1.75" font-weight="900" fill="#C66A00" text-anchor="start"><tspan x="17" dy="0">Hetzelfde feit hoort niet tegelijk direct én via een meetellende component in de specificatie.</tspan></text><rect x="12" y="177" width="186" height="13" rx="1.8" fill="#FFF7ED" stroke="#FDBA74" stroke-width="0.45" opacity="1" data-component="callout-card"></rect><circle cx="17.5" cy="183" r="2.8" fill="#FFFFFF" stroke="#C66A00" stroke-width="0.6" opacity="1"></circle><text x="17.5" y="183" font-family="Arial, Helvetica, sans-serif" font-size="2.5" font-weight="900" fill="#C66A00" text-anchor="middle" dominant-baseline="central" data-component="centered-text">i</text><text x="23" y="182.6" font-family="Arial, Helvetica, sans-serif" font-size="2.4" font-weight="900" fill="#C66A00" text-anchor="start"><tspan x="23" dy="0">Voorkom dubbele bronnen</tspan></text><text x="16" y="188" font-family="Arial, Helvetica, sans-serif" font-size="2.05" font-weight="400" fill="#102033" text-anchor="start"><tspan x="16" dy="0">Geeft een component Werkgeheugen = 8 GB door aan de assetspecificatie? Voer Werkgeheugen dan niet nogmaals als directe modelnummerwaarde in.</tspan></text><rect x="12" y="195" width="90" height="42" rx="1.2" fill="#FFFFFF" stroke="#C8D5E2" stroke-width="0.4" opacity="1"></rect><image href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABVUAAAOECAIAAAAuSkZYAAAQAElEQVR4nOzdCUBU1f4H8DMr27ANOwiIgMpWCImaKLmmSVpa7pZlWmllmqWVWWm9NFOzsv5PszQ1l9Je5r5GYuKGpIAKKgKyCsM2bMMs/3PvzMDMMMCwiEjfz/PRzJ17z13nzv2dld8tJIx0PO7TPycAAAAAAAAA0Ea4BAAAAAAAAAA6O77uG/Mejwpd/QmfT9qZXC7LTa26/jcBAAAAAAAAgHugLtRngv8uAeS+4PPVq0YWAAAAAAAAAMC9UFf/nyn5v6/u+wYAAAAAAAAAdFY67f/bv9q/gXbfAI6K2N0o5sqVBtO5CpVVboWwuIoAAAAAAAAAdAr/1v7/VEQolXkdSbdJK9WdzFGqzIuqPP7K8jiVLbcSEAAAAAAAAIBO4X6X+bc7WubPrVE4Xi3x/DNDzlEmvRii4jGZIByFUlihcP87R5x0V2Zrdm1CDyUfgyMAAAAAAABAJ/Hviv9p5G+VW9n9xN2y7NQLFZf8H52qMOcRpdKiuKbL+QKblIKskqtcy4DMqC41lgLCMZaCQsXgcgiXQwAAAAAAAAAeEHzy70DjdmFptdvpbNfUijOS/Yk1l56xm5X+iL1FYbVrQqEoteBqQWxadfIw0dP5D9uXelurG0ZwVEy9AK5cyatUWBRWWhRUCstqJD3FZR5WBAAAAAAAAODB8S+I/5UqQYVcnFzY5ZJEejdjT/m+O8rbzjx3C28/939Kra/m3JCcO1J9tkhx92FBH65Pt/xQJ36lQlhQRbMGLIprRIU18rIiixIlR6kq62qTF+pU6WpJUPYPAAAAAAAAD5ROHf+rVDyZwiajzPlCvk162dXyc3/LTlRyyjmE20cYJcjIL7qeeEL2d74iW8lRWBCrR8wHVJtzvWKyBcWV3BJpRbWkSJafJy/2FPoR125ZEU605F8p5KkQ/AMAAAAAAMCDp
