        </g><text x="24" y="150.3" font-family="Arial, Helvetica, sans-serif" font-size="2.05" font-weight="700" fill="#53657A" text-anchor="start"><tspan x="24" dy="0">Voorbeeld van een numerieke bijdrage; vergelijk ook de bijdragen van het verwachte onderdeel.</tspan></text><text x="23" y="157" font-family="Arial, Helvetica, sans-serif" font-size="1.82" font-weight="800" fill="#C66A00" text-anchor="start"><tspan x="23" dy="0">Hierarchy overlap warning vergelijkt getalattributen die op beide niveaus aan de assetspecificatie bijdragen.</tspan><tspan x="23" dy="2.45">Bepaal welk niveau de waarde levert; het verwachte onderdeel kan de bovenliggende waarde vervangen.</tspan><tspan x="23" dy="2.45">Corrigeer onbedoelde overlap. Geen waarschuwing betekent niet dat alle overige feiten kloppen.</tspan></text><rect x="23" y="174" width="166" height="49" rx="1.2" fill="#FFFFFF" stroke="#C8D5E2" stroke-width="0.4" opacity="1"></rect><image href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABVUAAAOECAIAAAAuSkZYAAAQAElEQVR4nOz9D3RTV57oe24D71Z1TdKTdihkLDsV09w48ryknjReMYkJNeXx3Mh+TF4CXUAhd141flWVRacxf0QXl6Eza1I8mmqLf75pJtU9TmWlUTWhGpLJcG3Rz+O6DXGCGS/pVuouDOlcnI4tY3Epv7yurOqqV48we59/OpKOZMmIYB++n5VFpKNz9tlnn2NJv7N/e2vRskcCYu65cO5ckWveuHFjSeW9BVeZPLbx6cMfZC0MHhnZ2yzE0IuNXX0ieHBk7yq1NOPp+LHQs4cvP7T17R93VKfLqd/6ZrRDZLw0+Xro6Z7L9Vvejj54tHF7TBjLh/Y0dsWMHdm2rTX2kqH9yMhLzVkVVgU+V21byV5gxlNhr/bZPaoOeoGZh5B1sLY16+zVs23VMqjVRN8kfZiyVva92I6u5ae2dewt8/VBW01yWlI/vnRTAwAAAABmdm36lwsXLixy5QXC9cYH+z/IXRrrPytu1QeXxrT/j31oBLCi7uF6a/n42FjBrWVUPGJJB/9SdUtQFXO5Z+excWPR5OvHhoyHY2P6wrP9MfnvQw/XiXK5bB7PJfN4quuWaws+mhT2w5yxoA/1giYHY2qTugfzB/W1HVF1/EeC8vEHh4/e+kkBAAAAADhZJNxu8qf9Kga1dbDr3eAqpl1lxKWx7Y0xrfM54+kPZiw71tUYMx/Xt329WtTWyWj8csZyu8uHn208LGvSGhR9scs9Tzf2GNsaHe+m6uc2B3tk3762vrEseOS5js1b6mM99oUi+LzqMC98o0HG1U83HpZ9+G1ipuPZbjueYItqneXyTsRlW1Uz9XU19snKd2fXXC03Fz20dbNKpnDeY2YqRH0Zb2YAAAAAAOxc3/9vdEHXL09Hls2tqrP5cmxQdmo3f3trvW3trKczeGjrkS3G6sGDegDfvDm9ROvTNlR3PG97tmrvyMFgwaKb9468vfUh+75UaFz9XPRIe3pZOpM/
