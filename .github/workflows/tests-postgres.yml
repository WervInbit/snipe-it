name: PostgreSQL Compatibility (Outside V1 Support)

on: workflow_dispatch

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    services:
      postgresql:
        image: postgres:16.10@sha256:21f6013073bc6b92830a2129570e2f5ec42a6c734b5a985a41e83aa58f54c3c1
        env:
          POSTGRES_DB: snipeit_test
          POSTGRES_USER: snipeit
          POSTGRES_PASSWORD: password
        ports:
          - 5432/tcp
        options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.2"


    name: PHP ${{ matrix.php-version }}

    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: none
          extensions: ldap,pdo_pgsql

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Copy .env
        run: |
          cp -v .env.testing.example .env
          cp -v .env.testing.example .env.testing

      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Setup Laravel
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_DATABASE: snipeit_test
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.postgresql.ports[5432] }}
          DB_USERNAME: snipeit
          DB_PASSWORD: password
          SNIPEIT_ALLOW_EXTERNAL_TEST_DATABASE: "1"
        run: |
          chmod -R 777 storage bootstrap/cache
          php artisan optimize:clear --env=testing
          php artisan migrate --force
          php artisan passport:install --no-interaction
          php artisan tinker --env=testing --execute="throw_unless(app()->environment('testing') && config('database.default') === 'pgsql' && config('database.connections.pgsql.database') === 'snipeit_test', new RuntimeException('Unsafe PostgreSQL CI target')); dump(app()->environment(), config('database.default'), config('database.connections.pgsql.database'));"

      - name: Execute tests (Unit and Feature tests) via PHPUnit
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_DATABASE: snipeit_test
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.postgresql.ports[5432] }}
          DB_USERNAME: snipeit
          DB_PASSWORD: password
          SNIPEIT_ALLOW_EXTERNAL_TEST_DATABASE: "1"
        run: php artisan test --env=testing --fail-on-incomplete --fail-on-skipped
