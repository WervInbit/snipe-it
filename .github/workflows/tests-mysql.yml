name: Tests in MariaDB

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    services:
      mariadb:
        image: mariadb:11.4.7@sha256:39596f079862334be04f4231664862e55d4febe54309cc62f750f2297de85b06
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: snipeit_test
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.2"

    name: PHP ${{ matrix.php-version }}

    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: none
          extensions: ldap,pdo_mysql

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Copy .env
        run: |
          cp -v .env.testing.example .env
          cp -v .env.testing.example .env.testing

      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Prepare disposable MariaDB application
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_DATABASE: snipeit_test
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.mariadb.ports[3306] }}
          DB_USERNAME: root
          SNIPEIT_ALLOW_EXTERNAL_TEST_DATABASE: "1"
        run: |
          chmod -R 777 storage bootstrap/cache
          php artisan optimize:clear --env=testing
          php artisan migrate --force
          php artisan passport:install --no-interaction
          php artisan tinker --env=testing --execute="throw_unless(app()->environment('testing') && config('database.default') === 'mysql' && config('database.connections.mysql.database') === 'snipeit_test', new RuntimeException('Unsafe MariaDB CI target')); dump(app()->environment(), config('database.default'), config('database.connections.mysql.database'));"

      - name: Execute guarded MariaDB unit and feature suite
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_DATABASE: snipeit_test
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.mariadb.ports[3306] }}
          DB_USERNAME: root
          SNIPEIT_ALLOW_EXTERNAL_TEST_DATABASE: "1"
        run: php artisan test --env=testing --fail-on-incomplete --fail-on-skipped
