services:
  app:
    environment:
      - APP_ENV=local
      - APP_URL=http://127.0.0.1:18080
      - APP_FORCE_TLS=false
      - APP_ALLOW_INSECURE_HOSTS=true
      - PHP_UPLOAD_LIMIT=32

  web:
    ports: !override
      - "127.0.0.1:18080:80"
    volumes: !override
      - ./:/var/www/html:ro
      - ./docker/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
